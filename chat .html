
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h2>Admin Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <div class="container">

            <aside class="sidebar">
                <ul>
                    <li>Overview</li>
                    <li>Users</li>
                    <li>Reports</li>
                    <li>Settings</li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main class="main-content">

                <div class="card">
                    <h3>Active Users</h3>
                    <p>1,248 currently online</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>

                </div>

                <div class="card">
                    <h3>Server Status</h3>
                    <p>All systems operational</p>
                </div>

            </main>

        </div>
    </div>

</body>
</html>
