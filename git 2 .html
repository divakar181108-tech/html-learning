
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08001f;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: #11052e;
            border: 2px solid #00f7ff;
            border-radius: 15px;
            box-shadow: 0 0 25px #00f7ff;
            text-align: center;
        }

        h1 {
            color: #00f7ff;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00f7ff;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #00f7ff;
            border-radius: 8px;
            background: transparent;
            color: white;
            outline: none;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #00f7ff;
            color: #08001f;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 20px #00f7ff;
            transform: scale(1.05);
        }

        p {
            color: white;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #00f7ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>LOGIN</h1>

        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">SIGN IN</button>
        </form>

        <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

</body>
</html>
