
<!DOCTYPE html>
<html>
<head>
    <title>Neon Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090019, #16003b, #001d3d);
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px #8a2be2;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00eaff;
        }

        .input-box {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #8a2be2;
            border-radius: 25px;
            outline: none;
            background: transparent;
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #cccccc;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #00eaff;
            color: #090019;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background: #8a2be2;
            color: white;
            box-shadow: 0 0 20px #8a2be2;
            transform: scale(1.05);
        }

        .extra {
            margin-top: 20px;
            color: white;
            font-size: 13px;
        }

        .extra a {
            color: #00eaff;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back</h1>

        <div class="input-box">
            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button>LOGIN</button>

        <div class="extra">
            Don't have an account?
            <a href="#">Register</a>
        </div>

    </div>

</body>
</html>
