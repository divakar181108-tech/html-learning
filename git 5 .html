
<!DOCTYPE html>
<html>
<head>
<title>Underwater World</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#001f3f, #0077b6, #00b4d8);
}

/* Ocean */
.ocean {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* Sunlight */
.ocean::before {
    content: "";
    position: absolute;
    top: 0;
    left: 30%;
    width: 250px;
    height: 100%;
    background: linear-gradient(
        180deg,
        rgba(255,255,255,0.2),
        transparent
    );
    transform: skew(-20deg);
}

/* Fish */
.fish {
    position: absolute;
    font-size: 55px;
    animation: swim 8s linear infinite;
}

.fish1 {
    top: 25%;
}

.fish2 {
    top: 50%;
    animation-delay: 2s;
    font-size: 40px;
}

.fish3 {
    top: 70%;
    animation-delay: 4s;
    font-size: 65px;
}

@keyframes swim {
    from {
        left: -100px;
    }
    to {
        left: 110%;
    }
}

/* Bubbles */
.bubble {
    position: absolute;
    bottom: -50px;
    width: 20px;
    height: 20px;
    border: 2px solid white;
    border-radius: 50%;
    animation: rise 6s infinite;
}

.b1 { left: 20%; }
.b2 { left: 40%; animation-delay: 2s; }
.b3 { left: 65%; animation-delay: 3s; }
.b4 { left: 85%; animation-delay: 1s; }

@keyframes rise {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

/* Sea plants */
.plant {
    position: absolute;
    bottom: 0;
    font-size: 65px;
}

.p1 { left: 5%; }
.p2 { right: 8%; }
.p3 { left: 45%; }

h1 {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial;
    letter-spacing: 5px;
    text-shadow: 0 0 15px cyan;
}
</style>
</head>

<body>

<div class="ocean">

    <h1>UNDERWATER WORLD</h1>

    <div class="fish fish1">🐠</div>
    <div class="fish fish2">🐟</div>
    <div class="fish fish3">🐡</div>

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <div class="plant p1">🌿</div>
    <div class="plant p2">🌱</div>
    <div class="plant p3">🪸</div>

</div>

</body>
</html>
