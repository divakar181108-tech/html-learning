
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Profile Card</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080812;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #7000ff;
    filter: blur(150px);
    top: 10%;
    left: 10%;
}

body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #00eaff;
    filter: blur(150px);
    bottom: 10%;
    right: 10%;
}

.card {
    position: relative;
    width: 320px;
    padding: 40px 30px;
    text-align: center;
    color: white;
    border-radius: 25px;
    background: #11111e;
    border: 1px solid #ffffff30;
    z-index: 1;
    overflow: hidden;
    transition: 0.5s;
}

.card:hover {
    transform: translateY(-15px) rotateX(5deg);
    box-shadow: 0 0 40px #00eaff55;
}

/* Neon circle */
.profile {
    width: 120px;
    height: 120px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #00eaff, #8a00ff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    font-weight: bold;
    color: white;
    box-shadow: 0 0 30px #00eaff;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { box-shadow: 0 0 10px #00eaff; }
    to { box-shadow: 0 0 35px #a000ff; }
}

h1 {
    margin-top: 25px;
    font-size: 27px;
    letter-spacing: 2px;
}

h3 {
    margin-top: 8px;
    color: #00eaff;
    font-weight: 400;
}

p {
    margin-top: 20px;
    color: #aaa;
    line-height: 1.6;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

.socials a {
    text-decoration: none;
    color: #00eaff;
    border: 1px solid #00eaff;
    padding: 10px 15px;
    border-radius: 10px;
    transition: 0.3s;
}

.socials a:hover {
    background: #00eaff;
    color: #080812;
    box-shadow: 0 0 20px #00eaff;
}

</style>
</head>

<body>

<div class="card">

    <div class="profile">A</div>

    <h1>Alex Morgan</h1>
    <h3>Creative Developer</h3>

    <p>
        Designing digital experiences
        with creativity, passion and code.
    </p>

    <div class="socials">
        <a href="#">GitHub</a>
        <a href="#">Instagram</a>
    </div>

</div>

</body>
</html>
