
<!DOCTYPE html>
<html>
<head>
<title>Brew House</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #211711;
    color: white;
}

header {
    display: flex;
    justify-content: space-between;
    padding: 25px 8%;
    background: #302117;
}

header h2 {
    color: #eab676;
}

.hero {
    text-align: center;
    padding: 90px 20px;
    background: #493021;
}

.hero h1 {
    font-size: 42px;
    color: #f5dfc4;
}

.hero p {
    margin: 20px;
    color: #ddc4aa;
}

button {
    background: #c58b55;
    color: #211711;
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.menu {
    padding: 50px 8%;
    text-align: center;
}

.menu h2 {
    color: #eab676;
    margin-bottom: 30px;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    background: #38271d;
    padding: 30px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    background: #59402d;
}

.card h3 {
    margin: 12px;
}

.card p {
    color: #eab676;
}

footer {
    text-align: center;
    padding: 25px;
    background: #302117;
    color: #ddc4aa;
}

@media (max-width: 500px) {
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h2>☕ Brew House</h2>
    <p>Fresh Coffee</p>
</header>

<section class="hero">
    <h1>Start Your Day With Coffee</h1>

    <p>
      Discover the perfect blend of
      taste, aroma and happiness.
    </p>

    <button>ORDER NOW</button>
</section>

<section class="menu">
    <h2>Our Special Menu</h2>

    <div class="container">

        <div class="card">
            <h3>Espresso</h3>
            <p>₹120</p>
        </div>

        <div class="card">
            <h3>Cappuccino</h3>
            <p>₹150</p>
        </div>

        <div class="card">
            <h3>Cold Coffee</h3>
            <p>₹180</p>
        </div>

        <div class="card">
            <h3>Mocha</h3>
            <p>₹170</p>
        </div>

    </div>
</section>

<footer>
    © 2026 Brew House | Made with Love
</footer>

</body>
</html>
