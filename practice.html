
<!DOCTYPE html>
<html>
<head>
    <title>Food Restaurant</title>
    <link rel="stylesheet" href="practice.css">
</head>

<body>

<!-- Header -->
<header>
    <h1>Food Restaurant</h1>

    <div class="menu">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </div>
</header>

<!-- Food Cards -->
<div class="container" id="home">

    <!-- First Card -->
    <div class="card">

        <div class="food-image">
            <span>Popular</span>
            <p>300 × 400</p>
        </div>

        <div class="details">
            <h2>Pizza</h2>
            <p>Cheese Pizza</p>
            <p>Price: ₹150</p>
             <button>Order Now</button>
        </div>

    </div>

    <!-- Second Card -->
    <div class="card">

        <div class="food-image">
            <span>Open</span>
            <p>300 × 400</p>
        </div>

        <div class="details">
            <h2>Burger</h2>
            <p>Chicken Burger</p>
            <p>Price: ₹100</p>
             <button>Order Now</button>
        </div>

    </div>

    <!-- Third Card -->
    <div class="card">

        <div class="food-image">
            <span>New</span>
            <p>300 × 400</p>
        </div>

        <div class="details">
            <h2>Sandwich</h2>
            <p>Cheese Sandwich</p>
            <p>Price: ₹120</p>
             <button>Order Now</button>
        </div>

    </div>

</div>

<!-- About Section -->
<section id="about">
    <h2>About Us</h2>
    <p>Welcome to our Food Restaurant!</p>
</section>

<!-- Contact Section -->
<section id="contact">
    <h2>Contact Us</h2>
    <p>Email: food@gmail.com</p>
</section>

</body>
</html>
