<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        table {
            margin: auto;
            display: flex;
            border-collapse: collapse;
            width: 50%;
        }
        th {
            background-color: #03720d;
            padding: 10px;
        }
        td, th {
            border: 1px solid #000;
        }
        td {
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #787878;
        }
        tr:hover {
            background-color: #e0e0e0;
        }
    </style>
    <table>
        <tr>
            <th>Header 1</th>
            <th>Header 2</th>
            <th>Header 3</th>  
        </tr>
        <tr>
            <td>Row 1, Cell 1</td>
            <td>Row 1, Cell 2</td>
            <td>Row 1, Cell 3</td>
        </tr>
        <tr>
            <td>Row 2, Cell 1</td>
            <td>Row 2, Cell 2</td>
            <td>Row 2, Cell 3</td> 
        </tr>
        <tr>        
            <td>Row 3, Cell 1</td>
            <td>Row 3, Cell 2</td>
            <td>Row 3, Cell 3</td>  
        </tr>
    </table>
</body>
</html>
